<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2ecdf">
<meta name="format-detection" content="telephone=no">
<title>雨夜留声 · 文字推理</title>
<style>
:root{
  --paper:#f2ecdf;
  --paper-2:#fbf7ee;
  --paper-3:#f7f0e3;
  --ink:#211d18;
  --ink-soft:#443c32;
  --muted:#776b5d;
  --line:#d8cab6;
  --line-soft:#e6dbc9;
  --accent:#8b3a2e;
  --accent-dark:#6f2a21;
  --accent-soft:#f0dfd7;
  --shadow:0 8px 24px rgba(60,44,26,.08);
  --radius:16px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 6%,rgba(255,255,255,.78),transparent 34%),
    radial-gradient(circle at 86% 84%,rgba(196,174,140,.16),transparent 46%),
    var(--paper);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  font-size:18px;
  line-height:1.85;
}
body.modal-open{overflow:hidden}
::selection{background:var(--accent-soft);color:var(--ink)}
.rain{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background-image:repeating-linear-gradient(102deg,rgba(54,71,84,.09) 0,rgba(54,71,84,.09) 1px,transparent 1px,transparent 28px);
  opacity:.18;
  animation:rainShift 24s linear infinite;
}
.rain:after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at 50% 0%,transparent 42%,rgba(50,37,23,.10) 100%);
}
@keyframes rainShift{
  from{transform:translate3d(0,-3%,0)}
  to{transform:translate3d(-2%,3%,0)}
}
#topbar{
  position:sticky;
  top:0;
  z-index:20;
  padding:10px 16px;
  padding-top:calc(10px + var(--safe-top));
  background:rgba(242,236,223,.97);
  border-bottom:1px solid rgba(139,58,46,.16);
}
.header-inner{
  display:flex;
  align-items:center;
  width:100%;
  max-width:700px;
  margin:0 auto;
}
.back{
  display:none;
  flex:0 0 40px;
  width:40px;
  height:40px;
  margin-right:8px;
  padding:0;
  border:1px solid var(--line);
  border-radius:50%;
  background:var(--paper-2);
  color:var(--ink-soft);
  font-size:21px;
  line-height:1;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.back:active{background:#fffaf0}
.brand{
  flex:1 1 auto;
  min-width:0;
  font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  font-size:18px;
  font-weight:600;
  letter-spacing:.12em;
  line-height:1.2;
  white-space:nowrap;
}
.brand small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:9px;
  font-weight:400;
  letter-spacing:.28em;
}
.header-actions{
  display:flex;
  align-items:center;
  flex:0 0 auto;
  margin-left:8px;
}
.tool{
  display:none;
  align-items:center;
  min-height:40px;
  margin-left:7px;
  padding:6px 11px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--paper-2);
  color:var(--ink-soft);
  font-family:inherit;
  font-size:13px;
  line-height:1;
  white-space:nowrap;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.tool:active{background:#fffaf0}
.tool b{
  margin-left:5px;
  color:var(--accent);
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
main{
  position:relative;
  z-index:1;
  width:100%;
  max-width:700px;
  margin:0 auto;
  padding:24px 20px 46px;
  padding-bottom:calc(46px + var(--safe-bottom));
}
.screen{animation:rise .28s ease-out}
@keyframes rise{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:none}
}
.kicker{
  margin:0 0 8px;
  color:var(--accent);
  font-size:11px;
  font-weight:600;
  letter-spacing:.22em;
  line-height:1.5;
}
h1,h2,h3,p{margin-top:0}
.display{
  margin:0 0 8px;
  font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  font-size:48px;
  font-weight:600;
  letter-spacing:.12em;
  line-height:1.16;
}
.display.small{font-size:40px}
.subtitle{
  margin:0 0 22px;
  color:var(--muted);
  font-size:14px;
  letter-spacing:.18em;
}
h2{
  margin:0 0 14px;
  font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  font-size:27px;
  font-weight:600;
  letter-spacing:.05em;
  line-height:1.35;
}
.hub-title{
  margin:0 0 12px;
  font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  font-size:28px;
  font-weight:600;
  letter-spacing:.03em;
  line-height:1.4;
}
.prose p{
  margin:0 0 .9em;
  text-align:justify;
  text-justify:inter-ideograph;
}
.prose p:last-child{margin-bottom:0}
.prose .dialogue{
  padding-left:13px;
  border-left:2px solid rgba(139,58,46,.28);
  color:#2d2720;
}
.time-mark{
  margin:26px 0 10px;
  color:var(--accent);
  font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  font-size:18px;
  font-weight:600;
  letter-spacing:.08em;
  line-height:1.4;
}
.note{
  color:var(--muted);
  font-size:13.5px;
  line-height:1.7;
}
.note.center{text-align:center}
.seal{
  display:flex;
  align-items:center;
  justify-content:center;
  width:46px;
  height:46px;
  margin:4px 0 18px;
  border-radius:7px;
  background:var(--accent);
  color:#fff7ec;
  box-shadow:0 5px 14px rgba(139,58,46,.22);
  font-family:"Songti SC","STSong","SimSun",serif;
  font-size:25px;
  line-height:1;
  transform:rotate(-3deg);
}
.rule-line{
  width:100%;
  height:1px;
  margin:20px 0 22px;
  background:linear-gradient(90deg,transparent,var(--line) 12%,var(--line) 88%,transparent);
}
.actions{margin-top:22px}
.section-title{
  display:flex;
  align-items:center;
  margin:27px 0 12px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
  letter-spacing:.22em;
  line-height:1.4;
}
.section-title span{flex:0 0 auto}
.section-title:after{
  content:"";
  flex:1 1 auto;
  height:1px;
  margin-left:12px;
  background:var(--line);
}
.choice{
  display:flex;
  align-items:center;
  width:100%;
  min-height:54px;
  margin:0 0 10px;
  padding:13px 15px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,252,246,.82);
  color:var(--ink);
  box-shadow:0 2px 0 rgba(80,60,40,.03);
  font-family:inherit;
  font-size:17px;
  line-height:1.5;
  text-align:left;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  transition:transform .12s ease,background .12s ease,border-color .12s ease;
}
.choice:active{
  transform:scale(.985);
  border-color:#c9b9a2;
  background:#fffaf0;
}
.choice-label{flex:1 1 auto;min-width:0;overflow-wrap:break-word}
.chev{
  flex:0 0 auto;
  margin-left:10px;
  color:var(--accent);
  font-size:22px;
  line-height:1;
  opacity:.75;
}
.badge{
  flex:0 0 auto;
  margin-left:8px;
  padding:2px 7px;
  border:1px solid var(--line);
  border-radius:999px;
  color:var(--muted);
  font-size:10.5px;
  line-height:1.5;
  white-space:nowrap;
}
.choice.primary{
  border-color:var(--accent);
  background:var(--accent);
  color:#fff8ee;
  box-shadow:0 7px 18px rgba(139,58,46,.18);
}
.choice.primary:active{background:var(--accent-dark)}
.choice.primary .chev{color:#fff8ee}
.choice.primary .badge{border-color:rgba(255,255,255,.38);color:#fff8ee}
.choice.ghost{
  justify-content:center;
  min-height:44px;
  border-color:transparent;
  background:transparent;
  box-shadow:none;
  color:var(--muted);
  font-size:15px;
  text-align:center;
}
.choice.ghost:active{background:rgba(139,58,46,.05)}
.card{
  margin:0 0 16px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:rgba(255,252,246,.72);
  box-shadow:var(--shadow);
}
.person{
  padding:15px 0;
  border-bottom:1px solid var(--line-soft);
}
.person:first-child{padding-top:0}
.person:last-child{padding-bottom:0;border-bottom:0}
.person-name{
  margin:0 0 6px;
  font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  font-size:21px;
  font-weight:600;
  letter-spacing:.06em;
  line-height:1.3;
}
.person-role{
  margin-left:7px;
  color:var(--accent);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:11px;
  font-weight:500;
  letter-spacing:.08em;
}
.person p{
  margin:0;
  color:var(--ink-soft);
  font-size:15.5px;
  line-height:1.75;
}
.rules{
  margin:0;
  padding:0;
  list-style:none;
}
.rules li{
  position:relative;
  margin:0 0 11px;
  padding-left:17px;
  color:var(--ink-soft);
  font-size:16px;
  line-height:1.75;
}
.rules li:last-child{margin-bottom:0}
.rules li:before{
  content:"·";
  position:absolute;
  left:2px;
  top:0;
  color:var(--accent);
  font-weight:700;
}
.clue-card{
  margin:16px 0;
  padding:12px 14px;
  border:1px solid #e2d2ba;
  border-left:4px solid var(--accent);
  border-radius:10px;
  background:#fbf4e8;
}
.clue-kicker{
  margin-bottom:4px;
  color:var(--accent);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.14em;
  line-height:1.5;
}
.clue-card p{
  margin:0;
  color:#3a3027;
  font-size:15.5px;
  line-height:1.7;
  text-align:left;
}
.steps{
  display:flex;
  align-items:center;
  margin:2px 0 18px;
}
.steps span{
  width:7px;
  height:7px;
  margin-right:7px;
  border-radius:50%;
  background:var(--line);
}
.steps span.done{background:#b7836f}
.steps span.on{background:var(--accent)}
.question{
  margin:16px 0 14px;
  color:var(--ink);
  font-size:18px;
  font-weight:600;
  line-height:1.6;
}
.summary{
  margin:18px 0;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:rgba(255,252,246,.76);
  box-shadow:var(--shadow);
}
.summary-row{
  display:flex;
  padding:9px 0;
  border-bottom:1px dashed var(--line);
  font-size:15px;
  line-height:1.7;
}
.summary-row:last-child{border-bottom:0;padding-bottom:0}
.summary-row:first-child{padding-top:0}
.summary-label{
  flex:0 0 92px;
  color:var(--muted);
  font-size:13px;
  letter-spacing:.06em;
}
.summary-value{flex:1 1 auto;min-width:0;color:var(--ink-soft);overflow-wrap:break-word}
.summary.stats .summary-label{flex-basis:80px}
.rank{
  margin:18px 0 6px;
  color:var(--accent);
  font-family:"Songti SC","STSong","SimSun",serif;
  font-size:17px;
  text-align:center;
}
.thanks{
  margin:8px 0 18px;
  color:var(--muted);
  font-size:14px;
  letter-spacing:.08em;
  text-align:center;
}
.footnote{
  margin:26px 0 0;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.1em;
  text-align:center;
}
.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  background:rgba(28,22,16,.44);
}
.modal.open{display:flex;align-items:flex-end;justify-content:center}
.sheet{
  display:flex;
  flex-direction:column;
  width:100%;
  max-width:700px;
  max-height:86vh;
  padding-bottom:var(--safe-bottom);
  border-radius:22px 22px 0 0;
  background:var(--paper-2);
  box-shadow:0 -12px 42px rgba(0,0,0,.22);
  animation:sheetUp .24s ease-out;
}
@keyframes sheetUp{
  from{opacity:.65;transform:translateY(18px)}
  to{opacity:1;transform:none}
}
.sheet-head{
  display:flex;
  align-items:center;
  padding:16px 18px 10px;
  border-bottom:1px solid var(--line);
}
.sheet-title{
  flex:1 1 auto;
  min-width:0;
  font-family:"Songti SC","STSong","SimSun",serif;
  font-size:22px;
  font-weight:600;
  letter-spacing:.06em;
  line-height:1.35;
}
.sheet-close{
  flex:0 0 42px;
  width:42px;
  height:42px;
  margin-left:8px;
  padding:0;
  border:1px solid var(--line);
  border-radius:50%;
  background:transparent;
  color:var(--muted);
  font-size:22px;
  line-height:1;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.sheet-close:active{background:#fffaf0}
.sheet-body{
  padding:16px 18px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.sheet-foot{
  padding:10px 18px 14px;
  border-top:1px solid var(--line);
}
.sheet-foot .choice{margin-bottom:0}
.sheet-count{
  margin-bottom:8px;
  color:var(--muted);
  font-size:12px;
  letter-spacing:.08em;
}
.note-group{margin:0 0 19px}
.note-group:last-child{margin-bottom:0}
.note-group h4{
  margin:0 0 8px;
  color:var(--accent);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.2em;
  line-height:1.5;
}
.note-item{
  display:flex;
  margin:0 0 9px;
  color:var(--ink-soft);
  font-size:15px;
  line-height:1.7;
}
.note-num{
  flex:0 0 23px;
  color:var(--muted);
  font-size:13px;
  font-variant-numeric:tabular-nums;
}
.hint-text{
  margin:0 0 14px;
  color:var(--ink);
  font-size:17px;
  line-height:1.8;
}
.hint-meta{
  margin:0 0 10px;
  color:var(--accent);
  font-size:11px;
  font-weight:600;
  letter-spacing:.16em;
}
@media (min-width:720px){
  #topbar{padding-left:24px;padding-right:24px}
  main{padding-top:34px}
  .choice:hover{background:#fffaf0;border-color:#c9b9a2}
  .choice.primary:hover{background:var(--accent-dark)}
  .modal.open{align-items:center}
  .sheet{border-radius:22px;margin-bottom:24px}
}
@media (max-width:360px){
  body{font-size:17px}
  main{padding-left:16px;padding-right:16px}
  #topbar{padding-left:12px;padding-right:12px}
  .brand{font-size:16px;letter-spacing:.08em}
  .back{flex-basis:40px;width:40px;height:40px;margin-right:6px}
  .tool{min-height:40px;margin-left:5px;padding:6px 9px;font-size:11.5px}
  .display{font-size:41px}
  .display.small{font-size:34px}
  h2{font-size:24px}
  .hub-title{font-size:25px}
  .choice{font-size:16px;padding:12px 13px}
  .person-role{display:block;margin:4px 0 0}
}
@media (prefers-reduced-motion:reduce){
  .screen,.sheet,.rain{animation:none}
}
</style>
</head>
<body>
<div class="rain" aria-hidden="true"></div>
<header id="topbar">
  <div class="header-inner">
    <button id="backBtn" class="back" type="button" aria-label="返回">←</button>
    <div class="brand">雨夜留声<small>文字推理</small></div>
    <div class="header-actions">
      <button id="noteBtn" class="tool" type="button">笔记 <b id="noteCount">2</b></button>
      <button id="hintBtn" class="tool" type="button">提示</button>
    </div>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<div id="modal" class="modal" aria-hidden="true"></div>
<noscript><p style="padding:24px;text-align:center">请开启 JavaScript 后游玩《雨夜留声》。</p></noscript>
<script>
var DATA = {
  clues: {

    door: {cat:'现场', text:'书房门是弹簧锁，带上就锁；窗户从里面闩着。'},
    muffled: {cat:'时间', text:'21:40 枪声很闷；枪响前楼上有持续的沙沙声。'},
    backstairs: {cat:'现场', text:'厨房后门有一道后楼梯，能绕开客厅上二楼，通往书房走廊。'},

    cardigan: {cat:'人物', text:'沈青禾的深红色开衫袖口少了一截，断口很新。'},
    suitcase: {cat:'人物', text:'沈青禾的床下有一只收拾好的皮箱和明天去上海的车票。'},
    wine: {cat:'人物', text:'罗坤今晚在酒窖喝过酒；他说不清 21:05 的行踪。'},
    sale: {cat:'动机', text:'陆鸿声要把山庄卖给许南枝的公司，罗坤可能被解雇。'},
    shen_alibi: {cat:'人物', text:'沈青禾说 21:00–21:35 独自在房间，21:35 到客厅，21:40 在牌桌旁。'},
    shen_records: {cat:'人物', text:'沈青禾负责整理陆鸿声的全部唱片，熟悉每一张的内容。'},
    shen_denial: {cat:'人物', text:'面对纤维，沈青禾说是下午给唱片除尘时蹭到的。'},

var app = document.getElementById('app');
var modal = document.getElementById('modal');
var backBtn = document.getElementById('backBtn');
var noteBtn = document.getElementById('noteBtn');
var hintBtn = document.getElementById('hintBtn');
var noteCount = document.getElementById('noteCount');
var state;

function has(key){ return !!state.clues[key]; }

function addClue(key){
  if (!DATA.clues[key] || state.clues[key]) return false;
  state.clues[key] = true;
  updateNoteCount();
  return true;
}

function updateNoteCount(){
  if (noteCount) noteCount.textContent = Object.keys(state.clues).length;
}

function para(text){
  if (!text) return '';
  if (text.charAt(0) === '【' && text.charAt(text.length - 1) === '】') {
    return '<h3 class="time-mark">' + text + '</h3>';
  }
  if (text.charAt(0) === '“') {
    return '<p class="dialogue">' + text + '</p>';
  }
  return '<p>' + text + '</p>';
}

function paras(arr){
  var out = '';
  if (!arr) return out;
  for (var i = 0; i < arr.length; i++) out += para(arr[i]);
  return out;
}

function kicker(text){
  return '<div class="kicker">' + text + '</div>';
}

function section(text){
  return '<div class="section-title"><span>' + text + '</span></div>';
}

function choice(label, act, arg, opts){
  opts = opts || {};
  var cls = 'choice';
  if (opts.primary) cls += ' primary';
  if (opts.ghost) cls += ' ghost';
  var badge = opts.badge ? '<span class="badge">' + opts.badge + '</span>' : '';
  var chev = opts.ghost ? '' : '<span class="chev">›</span>';
  return '<button type="button" class="' + cls + '" data-act="' + act + '" data-arg="' + (arg || '') + '">' +
    '<span class="choice-label">' + label + '</span>' + badge + chev + '</button>';
}

function clueCards(keys){
  var out = '';
  for (var i = 0; i < keys.length; i++) {
    var c = DATA.clues[keys[i]];
    if (!c) continue;
    out += '<div class="clue-card"><div class="clue-kicker">新线索 · ' + c.cat + '</div><p>' + c.text + '</p></div>';
  }
  return out;
}

function stepsHTML(step){
  var out = '<div class="steps" aria-hidden="true">';
  for (var i = 1; i <= 3; i++) {
    out += '<span class="' + (i < step ? 'done' : (i === step ? 'on' : '')) + '"></span>';
  }
  return out + '</div>';
}

    out += choice(a.label, 'detail', id + '.' + a.id, {badge: asked ? '已查看' : ''});
  }
  out += choice('返回调查', 'hub', '', {ghost:true});
  return out + '</section>';
}

function detailHTML(loc, detail){
  var d = DATA.details[loc + '.' + detail];
  if (!d) return hubHTML();
  var newKeys = [];
  function add(key){
    if (addClue(key)) newKeys.push(key);
  }
  for (var i = 0; i < d.clues.length; i++) add(d.clues[i]);
  var extra = [];
  if (typeof d.after === 'function') extra = d.after(add);
  var out = '<section class="screen">';
  out += kicker('调查 · ' + DATA.locations[loc].name);
  out += '<h2>' + d.title + '</h2>';
  if (state.screen.already) out += '<p class="note">你再次查看了这里。</p>';
  out += '<div class="prose">' + paras(d.paras);
  if (extra && extra.length) out += paras(extra);
  out += '</div>';
  out += clueCards(newKeys);
  out += '<div class="actions">' + choice('继续调查', 'location', loc, {primary:true}) + '</div>';
  return out + '</section>';
}

function topicsFor(person){
  var ids = [];
  if (person === 'shen') {
    ids = ['alibi','will','records','debt'];
    if (has('fiber_match')) ids.push('fiber');
    if (has('record') && has('muffled')) ids.push('sound');
  } else if (person === 'gu') {
    ids = ['time','wound','shot','old'];
    if (has('watch')) ids.push('watch');
    if (has('will')) ids.push('letter');
  } else if (person === 'luo') {
    ids = ['alibi','thud','door','sale','after','umbrella'];
  } else if (person === 'xu') {
    ids = ['quarrel','alibi','shen','gramophone'];
  }
  return ids;
}

function interviewHTML(id){
  var p = DATA.people[id];
  var ids = topicsFor(id);
  var out = '<section class="screen">';
  out += kicker('交谈 · ' + p.role);
  out += '<h2>' + p.name + '</h2>';
  out += '<div class="prose">' + paras(p.intro) + '</div>';
  out += section('你想问');
  for (var i = 0; i < ids.length; i++) {
    var key = id + '.' + ids[i];
    var t = DATA.topics[key];
    var asked = state.seen['ask_' + key];
    out += choice(t.label, 'topic', key, {badge: asked ? '已问' : ''});
  }
  out += choice('结束谈话', 'hub', '', {ghost:true});
  return out + '</section>';
}

function topicHTML(person, topic){
  var t = DATA.topics[person + '.' + topic];
  if (!t) return interviewHTML(person);
  var newKeys = [];
  function add(key){
    if (addClue(key)) newKeys.push(key);
  }
  for (var i = 0; i < t.clues.length; i++) add(t.clues[i]);
  var extra = [];
  if (typeof t.after === 'function') extra = t.after(add);
  var out = '<section class="screen">';
  out += kicker('交谈 · ' + DATA.people[person].name);
  out += '<h2>' + t.label + '</h2>';
  if (state.screen.already) out += '<p class="note">这个问题你已经问过了。</p>';
  out += '<div class="prose">' + paras(t.paras);
  if (extra && extra.length) out += paras(extra);
  out += '</div>';
  out += clueCards(newKeys);
  out += choice('继续谈话', 'interview', person, {primary:true});
  out += choice('返回调查', 'hub', '', {ghost:true});
  return out + '</section>';
}

function accuseHTML(step){
  var out = '<section class="screen">';
  out += kicker('指认 · ' + step + ' / 3');
  out += '<h2>指认</h2>';
  out += stepsHTML(step);
  if (step === 1) {
    out += '<div class="prose"><p>你合上笔记本。客厅里的人都看着你。“我知道是谁杀了陆鸿声。”</p></div>';
    out += '<div class="question">第一个问题：凶手是谁？</div>';
    out += choice('沈青禾', 'accuseChoice', 'shen');
    out += choice('顾行舟', 'accuseChoice', 'gu');
    out += choice('罗坤', 'accuseChoice', 'luo');
    out += choice('许南枝', 'accuseChoice', 'xu');
  } else if (step === 2) {
    out += '<div class="question">第二个问题：21:40 的枪声，是怎么回事？</div>';
    out += choice('留声机播放了一张灌有枪声的唱片', 'accuseChoice', 'record');
    out += choice('凶手从窗外开了一枪', 'accuseChoice', 'window');
    out += choice('顾行舟替凶手作了伪证', 'accuseChoice', 'lie');
    out += choice('陆鸿声自己走火', 'accuseChoice', 'accident');
  } else {
    out += '<div class="question">第三个问题：什么证据能证明陆鸿声真正的死亡时间？</div>';
    out += choice('停在 21:05 的腕表，和罗坤听到的闷响', 'accuseChoice', 'time');
    out += choice('顾行舟的尸温判断', 'accuseChoice', 'temp');
    out += choice('书房门是弹簧锁', 'accuseChoice', 'door');
    out += choice('新遗嘱的签署时间', 'accuseChoice', 'will');
  }
  out += choice('返回调查', 'hub', '', {ghost:true});
  return out + '</section>';
}

function feedbackHTML(){
  var f = state.feedback;
  var out = '<section class="screen">';
  out += kicker('指认 · 推理不成立');
  out += '<h2>再想想。</h2>';
  if (f.lead) out += '<div class="prose"><p>' + f.lead + '</p></div>';
  out += '<div class="prose"><p>' + f.text + '</p></div>';
  out += '<div class="actions">' + choice('再试一次', 'feedbackRetry', '', {primary:true}) + '</div>';
  out += choice('返回调查', 'hub', '', {ghost:true});
  return out + '</section>';
}

function caseSummary(){
  var n = Object.keys(state.clues).length;
  var rank = n >= 28 ? '你几乎看穿了山庄的每一道缝隙。' : '你抓住了足够多的细节。';
  var out = '<div class="summary">';
  for (var i = 0; i < DATA.summary.length; i++) {
    out += '<div class="summary-row"><div class="summary-label">' + DATA.summary[i].label + '</div><div class="summary-value">' + DATA.summary[i].value + '</div></div>';
  }
  out += '</div>';
  out += '<div class="summary stats"><div class="summary-row"><div class="summary-label">调查记录</div><div class="summary-value">' + n + ' 条线索 · ' + state.hintIndex + ' 次提示 · ' + state.wrong + ' 次错误判断</div></div></div>';
  out += '<p class="rank">' + rank + '</p>';
  out += '<p class="thanks">感谢游玩《雨夜留声》。</p>';
  return out;
}

function revealHTML(page){
  if (!DATA.reveal[page]) page = 0;
  var r = DATA.reveal[page];
  var out = '<section class="screen reveal">';
  if (page === 0) {
    out += kicker('揭底');
    out += '<h1 class="display small">真相</h1>';
  } else {
    out += kicker('真相 · ' + (page + 1) + ' / ' + DATA.reveal.length);
  }
  if (r.title) out += '<h2>' + r.title + '</h2>';
  if (r.paras && r.paras.length) out += '<div class="prose">' + paras(r.paras) + '</div>';
  if (r.final) out += caseSummary();
  if (page < DATA.reveal.length - 1) {
    out += '<div class="actions">' + choice('继续', 'reveal', String(page + 1), {primary:true}) + '</div>';
  } else {
    out += '<div class="actions">' + choice('重新开始', 'restart', '', {primary:true}) + '</div>';
    out += choice('查看笔记', 'notebook', '', {ghost:true});
  }
  return out + '</section>';
}

function screenHTML(){
  var s = state.screen;
  if (s.type === 'intro') return introHTML(s.page);
  if (s.type === 'hub') return hubHTML();
  if (s.type === 'location') return locationHTML(s.id);
  if (s.type === 'detail') return detailHTML(s.loc, s.detail);
  if (s.type === 'interview') return interviewHTML(s.id);
  if (s.type === 'topic') return topicHTML(s.person, s.topic);
  if (s.type === 'accuse') return accuseHTML(s.step);
  if (s.type === 'feedback') return feedbackHTML();
  if (s.type === 'reveal') return revealHTML(s.page);
  return hubHTML();
}

/* ---------------- 导航 ---------------- */

function renderHeader(){
  var showTools = state.started && state.screen.type !== 'intro';
  var showHint = showTools && state.screen.type !== 'reveal';
  noteBtn.style.display = showTools ? 'inline-flex' : 'none';
  hintBtn.style.display = showHint ? 'inline-flex' : 'none';
  backBtn.style.display = state.back ? 'inline-flex' : 'none';
  noteCount.textContent = Object.keys(state.clues).length;
}

function render(){
  var html = screenHTML();
  renderHeader();
  app.innerHTML = html;
  bindChoices();
  window.scrollTo(0, 0);
}

function bindChoices(){
  var nodes = app.querySelectorAll('[data-act]');
  for (var i = 0; i < nodes.length; i++) {
    nodes[i].onclick = function(){
      handleAction(this.getAttribute('data-act'), this.getAttribute('data-arg'));
    };
  }
}

function handleAction(act, arg){
  if (act === 'intro') goIntro(parseInt(arg, 10));
  else if (act === 'start') startGame();
  else if (act === 'hub') goHub();
  else if (act === 'location') goLocation(arg);
  else if (act === 'detail') {
    var dp = arg.split('.');
    goDetail(dp[0], dp[1]);
  }
  else if (act === 'interview') goInterview(arg);
  else if (act === 'topic') {
    var tp = arg.split('.');
    goTopic(tp[0], tp[1]);
  }
  else if (act === 'accuse') goAccuse(parseInt(arg, 10));
  else if (act === 'accuseChoice') handleAccuseChoice(arg);
  else if (act === 'feedbackRetry') goAccuse(state.feedback.step);
  else if (act === 'reveal') goReveal(parseInt(arg, 10));
  else if (act === 'restart') resetGame();
  else if (act === 'notebook') openNotebook();
}

function goIntro(page){
  state.screen = {type:'intro', page:page};
  state.back = page > 0 ? {type:'intro', page:page - 1} : null;
  render();
}

function startGame(){
  state.started = true;
  goHub();
}

function goHub(){
  state.screen = {type:'hub'};
  state.back = null;
  render();
}

function goLocation(id){
  state.seen['loc_' + id] = true;
  state.screen = {type:'location', id:id};
  state.back = {type:'hub'};
  render();
}

function goDetail(loc, detail){
  var key = 'detail_' + loc + '.' + detail;
  var already = !!state.seen[key];
  state.seen[key] = true;
  state.screen = {type:'detail', loc:loc, detail:detail, already:already};
  state.back = {type:'location', id:loc};
  render();
}

function goInterview(id){
  state.seen['talk_' + id] = true;
  state.screen = {type:'interview', id:id};
  state.back = {type:'hub'};
  render();
}

function goTopic(person, topic){
  var key = 'ask_' + person + '.' + topic;
  var already = !!state.seen[key];
  state.seen[key] = true;
  state.screen = {type:'topic', person:person, topic:topic, already:already};
  state.back = {type:'interview', id:person};
  render();
}

function goAccuse(step){
  state.screen = {type:'accuse', step:step};
  state.back = {type:'hub'};
  render();
}

function handleAccuseChoice(value){
  var step = state.screen.step;
  if (step === 1) {
    if (value === 'shen') goAccuse(2);
    else goFeedback(1, '', DATA.feedback.culprit[value]);
  } else if (step === 2) {
    if (value === 'record') goAccuse(3);
    else goFeedback(2, DATA.feedback.methodLead, DATA.feedback.method[value]);
  } else {
    if (value === 'time') goReveal(0);
    else goFeedback(3, DATA.feedback.evidenceLead, DATA.feedback.evidence[value]);
  }
}

function goFeedback(step, lead, text){
  state.wrong++;
  state.feedback = {step:step, lead:lead || '', text:text || ''};
  state.screen = {type:'feedback'};
  state.back = {type:'hub'};
  render();
}

function goReveal(page){
  state.screen = {type:'reveal', page:page};
  state.back = null;
  state.finished = (page === DATA.reveal.length - 1);
  render();
}

function goBack(){
  var b = state.back;
  if (!b) return;
  if (b.type === 'hub') goHub();
  else if (b.type === 'location') goLocation(b.id);
  else if (b.type === 'interview') goInterview(b.id);
  else if (b.type === 'intro') goIntro(b.page);
}

/* ---------------- 笔记与提示 ---------------- */

function openModal(html){
  modal.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');
  document.body.classList.add('modal-open');
  bindModal();
}

function closeModal(){
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden', 'true');
  modal.innerHTML = '';
  document.body.classList.remove('modal-open');
}

function bindModal(){
  var closeBtns = modal.querySelectorAll('[data-close]');
  for (var i = 0; i < closeBtns.length; i++) {
    closeBtns[i].onclick = closeModal;
  }
  var next = modal.querySelector('[data-hint-next]');
  if (next) next.onclick = openHint;
}

function openNotebook(){
  var keys = Object.keys(state.clues);
  var groups = ['已知','现场','时间','人物','动机'];
  var body = '';
  var num = 0;
  for (var g = 0; g < groups.length; g++) {
    var items = [];
    for (var i = 0; i < keys.length; i++) {
      var c = DATA.clues[keys[i]];
      if (c && c.cat === groups[g]) items.push(c);
    }
    if (!items.length) continue;
    body += '<div class="note-group"><h4>' + groups[g] + '</h4>';
    for (var j = 0; j < items.length; j++) {
      num++;
      body += '<div class="note-item"><span class="note-num">' + num + '.</span><span>' + items[j].text + '</span></div>';
    }
    body += '</div>';
  }
  if (!body) body = '<p class="note">笔记本还是空的。</p>';
  var html = '<div class="sheet-head"><div class="sheet-title">笔记</div><button type="button" class="sheet-close" data-close="1" aria-label="关闭">×</button></div>';
  html += '<div class="sheet-body">' + body + '</div>';
  html += '<div class="sheet-foot"><div class="sheet-count">共 ' + num + ' 条线索</div><button type="button" class="choice primary" data-close="1">合上笔记</button></div>';
  openModal(html);
}

function openHint(){
  var idx = state.hintIndex;
  var title;
  var body;
  var foot;
  if (idx < DATA.hints.length) {
    state.hintIndex++;
    title = '提示 ' + state.hintIndex + ' / ' + DATA.hints.length;
    body = '<div class="hint-meta">分层提示</div><p class="hint-text">' + DATA.hints[idx] + '</p>';
    body += '<p class="note">提示会逐条推进；最后一条会直接说出凶手。</p>';
    if (state.hintIndex < DATA.hints.length) {
      foot = '<button type="button" class="choice" data-hint-next="1">下一条提示<span class="chev">›</span></button>';
    } else {
      foot = '<button type="button" class="choice primary" data-close="1">知道了</button>';
    }
  } else {
    title = '提示';
    body = '<p class="hint-text">没有更多提示了。</p>';
    foot = '<button type="button" class="choice primary" data-close="1">合上</button>';
  }
  var html = '<div class="sheet-head"><div class="sheet-title">' + title + '</div><button type="button" class="sheet-close" data-close="1" aria-label="关闭">×</button></div>';
  html += '<div class="sheet-body">' + body + '</div>';
  html += '<div class="sheet-foot">' + foot + '</div>';
  openModal(html);
}

/* ---------------- 初始化 ---------------- */

function resetGame(){
  state = {
    started: false,
    screen: {type:'intro', page:0},
    back: null,
    clues: {},
    seen: {},
    hintIndex: 0,
    wrong: 0,
    finished: false,
    feedback: null
  };
  closeModal();
  addClue('self_alibi');
  addClue('self_absence');
  goIntro(0);
}

backBtn.onclick = goBack;
noteBtn.onclick = openNotebook;
hintBtn.onclick = openHint;
modal.onclick = function(e){
  if (e.target === modal) closeModal();
};
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeModal();
});

resetGame();
</script>
